services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: health-copilot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - USE_MOCK_AI=true
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./praveen/backend/uploads:/app/praveen/backend/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./naveen/hi-main/hi-main/frontend
      dockerfile: Dockerfile
    container_name: health-copilot-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
